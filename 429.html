<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>418 I'm a Teapot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            gap: 40px;
            padding: 40px;
            align-items: center;
            justify-content: center;
        }
        
        .error-content {
            color: white;
            text-align: center;
            z-index: 10;
            max-width: 400px;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            animation: float 3s ease-in-out infinite;
        }
        
        .error-message {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .error-description {
            font-size: 18px;
            margin-bottom: 10px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .error-subtext {
            font-size: 14px;
            opacity: 0.7;
            font-style: italic;
            margin-top: 20px;
        }
        
        .actual-error {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        #canvas-container {
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            cursor: none;
            position: relative;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            
            #canvas-container {
                width: 300px;
                height: 300px;
            }
            
            .error-code {
                font-size: 80px;
            }
            
            .error-message {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-content">
            <h1 class="error-code">418</h1>
            <h2 class="error-message">I'm a Teapot</h2>
            <p class="error-description">You've sent too many requests. The server decided it wants to be a teapot and refuses to brew your coffee.</p>
            <div class="actual-error">(429 Too Many Requests)</div>
        </div>
        <div id="canvas-container"></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/STLLoader.js"></script>
    <script src="script.js"></script>
</body>
</html>
