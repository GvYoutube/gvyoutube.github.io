<!doctype HTML>

  <body>

    <h1>A collection of images I took while practicing with a DSLR in school.</h1>
    <h3>Image 1: Exit</h3><br>
    <img src="Exit.JPG" type="image/jpeg"><br>
    <h3>Image 2: Book¹⁰</h3><br>
    <img src="Book^10.JPG" type="image/jpeg"><br>
    <h3>Image 3: Time</h3><br>
    <img src="Time.JPG" type="image/jpeg"><br>
    <h3>Image 4: Exit Again</h3><br>
    <img src="ExitAgain.jpg" type="image/jpeg">
    <script>
  document.addEventListener("DOMContentLoaded", () => {
    const images = document.querySelectorAll("img");

    images.forEach((image) => {
      // Prevent the context menu from opening on images
      image.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      // Prevent users from dragging images
      image.addEventListener("dragstart", (event) => {
        event.preventDefault();
      });

      // Prevent common mouse-based image saving actions
      image.addEventListener("mousedown", (event) => {
        if (event.button === 2) {
          event.preventDefault();
        }
      });
    });
  });
</script>
  </body>
</html>
