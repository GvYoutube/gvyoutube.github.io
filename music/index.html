<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player - GvYoutube Gaming</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      color: white;
      text-decoration: none;
      font-size: 0.9em;
      transition: all 0.3s;
    }

    .back-btn:hover {
      text-decoration: underline;
      transform: translateX(-5px);
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      color: white;
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5em;
    }

    .input-section {
      background: white;
      padding: 30px;
      border-radius: 10px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h3 {
      margin-bottom: 20px;
      color: #333;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 30px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }

    button:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      background: #ffe0e0;
      color: #c00;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .player-section {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      display: none;
    }

    .player-section.active {
      display: block;
    }

    .turntable {
      width: 300px;
      height: 300px;
      margin: 0 auto 30px;
      position: relative;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, #000);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset -5px -5px 20px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      animation: spinVinyl 3s linear infinite;
    }

    .vinyl.paused {
      animation-play-state: paused;
    }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .vinyl-label {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      background-image: url('default.png');
    }

    .vinyl-center {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #333;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5), 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .vinyl-center::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: #555;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .song-info {
      margin-bottom: 30px;
    }

    .song-title {
      font-size: 1.5em;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    .song-duration {
      color: #666;
      font-size: 0.9em;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      cursor: pointer;
      background: #667eea;
      color: white;
      border: none;
      transition: all 0.3s;
      padding: 0;
    }

    .control-btn:hover {
      background: #764ba2;
      transform: scale(1.1);
    }

    .download-btn {
      background: #27ae60;
      padding: 12px 30px;
      margin-top: 20px;
    }

    .download-btn:hover {
      background: #229954;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: #667eea;
      border-radius: 3px;
      width: 0%;
    }

    audio {
      display: none;
    }

    .disclaimer {
      font-size: 0.8em;
      color: #666;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-btn">← Back to Home</a>
    
    <h1>We're sorry, this page does not work yet!</h1>

    <div class="input-section">
      <h3>Paste a YouTube Link</h3>
      <div class="input-group">
        <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." />
        <button id="loadBtn" onclick="loadMusic()">Load</button>
      </div>
      <div class="error" id="error"></div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Extracting audio...</p>
      </div>
    </div>

    <div class="player-section" id="playerSection">
      <div class="turntable">
        <div class="vinyl" id="vinyl">
          <div class="vinyl-label" id="vinylLabel"></div>
          <div class="vinyl-center"></div>
        </div>
      </div>

      <div class="song-info">
        <div class="song-title" id="songTitle">Loading...</div>
        <div class="song-duration" id="songDuration">0:00 / 0:00</div>
      </div>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="controls">
        <button class="control-btn" onclick="previousSong()">⏮</button>
        <button class="control-btn" id="playBtn" onclick="togglePlay()">▶</button>
        <button class="control-btn" onclick="nextSong()">⏭</button>
      </div>

      <button class="download-btn" id="downloadBtn" onclick="downloadAudio()">⬇ Download MP3</button>
      <p class="disclaimer">Downloaded audio is for personal use only. Respect copyright laws.</p>
    </div>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>
  </div>

  <script>
    const youtubeInput = document.getElementById('youtubeUrl');
    const loadBtn = document.getElementById('loadBtn');
    const playerSection = document.getElementById('playerSection');
    const errorDiv = document.getElementById('error');
    const loadingDiv = document.getElementById('loading');
    const audioPlayer = document.getElementById('audioPlayer');
    const vinyl = document.getElementById('vinyl');
    const vinylLabel = document.getElementById('vinylLabel');
    const songTitle = document.getElementById('songTitle');
    const songDuration = document.getElementById('songDuration');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentMusic = null;

    async function loadMusic() {
      const url = youtubeInput.value.trim();
      if (!url) {
        showError('Please enter a YouTube URL');
        return;
      }

      errorDiv.classList.remove('show');
      loadingDiv.classList.add('show');
      playerSection.classList.remove('active');
      loadBtn.disabled = true;

      try {
        const response = await fetch('/music/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to extract audio');
        }

        currentMusic = data;
        songTitle.textContent = data.title;
        vinylLabel.style.backgroundImage = `url('${data.thumbnail}')`;
        audioPlayer.src = `/music/stream?videoId=${data.videoId}`;

        loadingDiv.classList.remove('show');
        playerSection.classList.add('active');
        loadBtn.disabled = false;

      } catch (error) {
        showError(error.message);
        loadingDiv.classList.remove('show');
        loadBtn.disabled = false;
      }
    }

    function showError(message) {
      errorDiv.textContent = '❌ ' + message;
      errorDiv.classList.add('show');
    }

    function togglePlay() {
      if (audioPlayer.paused) {
        audioPlayer.play();
        playBtn.textContent = '⏸';
        vinyl.classList.remove('paused');
      } else {
        audioPlayer.pause();
        playBtn.textContent = '▶';
        vinyl.classList.add('paused');
      }
    }

    function downloadAudio() {
      if (!currentMusic) {
        showError('No music loaded');
        return;
      }

      downloadBtn.disabled = true;
      downloadBtn.textContent = '⬇ Downloading...';

      const title = encodeURIComponent(currentMusic.title);
      const downloadUrl = `/music/download?videoId=${currentMusic.videoId}&title=${title}`;
      
      const link = document.createElement('a');
      link.href = downloadUrl;
      link.download = currentMusic.title + '.mp3';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      setTimeout(() => {
        downloadBtn.disabled = false;
        downloadBtn.textContent = '⬇ Download MP3';
      }, 2000);
    }

    function previousSong() {
      audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
    }

    function nextSong() {
      audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5);
    }

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressFill.style.width = percent + '%';
        const current = formatTime(audioPlayer.currentTime);
        const duration = formatTime(audioPlayer.duration);
        songDuration.textContent = `${current} / ${duration}`;
      }
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      audioPlayer.currentTime = percent * audioPlayer.duration;
    });

    audioPlayer.addEventListener('ended', () => {
      playBtn.textContent = '▶';
      vinyl.classList.add('paused');
    });

    youtubeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadMusic();
    });
  </script>
</body>
</html>
