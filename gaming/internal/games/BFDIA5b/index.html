<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFDIA 5b</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <h1>Play BFDIA 5b</h1>
    <p>If the game doesn't load, make sure your browser supports WebAssembly and has JavaScript enabled.</p>

    <!-- Ruffle will replace this <object> tag with the SWF content -->
    <object 
        data="bfdia5b.swf" 
        type="application/x-shockwave-flash" 
        width="800" 
        height="600">
        <param name="movie" value="bfdia5b.swf">
        <p>Your browser does not support Flash content.</p>
    </object>

    <!-- Add Ruffle container for user experience -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        const ruffle = window.RufflePlayer.newest();
        ruffle.config = { autoplay: 'on' };
        document.querySelector('object').outerHTML = ruffle.createPlayer().outerHTML.replace('filename.swf', 'bfdia5b.swf');
    </script>
</body>
</html>
