<html>
<head>
	<title>5b - Battle for Dream Island</title>
	<meta name="description" content="A puzzle platformer in the world of Battle for Dream Island.">
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css" type="text/css">
	<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
	<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
	<style>
		#debug-log {
			display: none; /* Hidden initially */
			position: fixed;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 200px;
			overflow-y: auto;
			background-color: black;
			color: white;
			font-family: monospace;
			padding: 10px;
			z-index: 1000;
		}
	</style>
</head>
<body>
<div id="center">
	<script>
	window.RufflePlayer = window.RufflePlayer || {};
	window.RufflePlayer.config = {
		"allowScriptAccess": true,
		"base": "https://gvyoutube.codeberg.page/gaming/internal/games/5b/",
		"autoplay": "auto"
	};

	// Custom debug logger
	function logToPage(message) {
		const logContainer = document.getElementById('debug-log');
		logContainer.style.display = 'block'; // Show debug log automatically
		const logEntry = document.createElement('div');
		logEntry.textContent = message;
		logContainer.appendChild(logEntry);

		// Scroll to the bottom for latest logs
		logContainer.scrollTop = logContainer.scrollHeight;
	}

	// SWF Player initialization with logging
	window.addEventListener("load", (event) => {
		try {
			const ruffle = window.RufflePlayer.newest();
			const player = ruffle.createPlayer();
			const container = document.getElementById("center");
			container.appendChild(player);

			logToPage("INFO: Initializing Ruffle player...");
			player.load("c.swf?path=5b.swf")
				.then(() => {
					logToPage("SUCCESS: SWF loaded successfully.");
				})
				.catch(error => {
					logToPage(`ERROR: Failed to load SWF. Error: ${error}`);
				});

		} catch (error) {
			logToPage(`CRITICAL ERROR: ${error}`);
		}

		logToPage("INFO: Debug overlay enabled.");
	});

	// Activate debug log viewer using the key combination
	let keyLog = [];
	const debugCombo = "d+e+b+u+g".split("+");
	document.addEventListener("keydown", (e) => {
		keyLog.push(e.key.toLowerCase());
		if (keyLog.slice(-debugCombo.length).join("") === debugCombo.join("")) {
			const logContainer = document.getElementById("debug-log");
			logContainer.style.display = logContainer.style.display === "none" ? "block" : "none";
			console.log("Debug log toggled by key combo.");
		}
	});
	</script>
	<p>
		This game is part of <a href="http://battlefordreamisland.com">Battle for Dream Island</a>.<br>
		<a href="http://htwins.net">HTwins.net</a>
	</p>
</div>

<!-- Debug log display -->
<div id="debug-log"></div>
</body>
</html>
