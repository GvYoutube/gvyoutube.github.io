<html>
<head>
	<title>5b - Battle for Dream Island</title>
	<meta name="description" content="A puzzle platformer in the world of Battle for Dream Island.">
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css" type="text/css">
	<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
	<script src="ruffle.js"></script>
</head>
<body>
<div id="center">
	<script>
	window.RufflePlayer = window.RufflePlayer || {};
	window.RufflePlayer.config = {
		"publicPath": "https://gvyoutube.codeberg.page/gaming/internal/games/5b/", // Base path for resources (wasm file)
		"allowScriptAccess": true,
		"autoplay": "auto"
	};

	// Initialize Ruffle player
	window.addEventListener("load", () => {
		try {
			const ruffle = window.RufflePlayer.newest(); // Use the latest Ruffle version
			const player = ruffle.createPlayer(); // Create a new Ruffle player instance
			const container = document.getElementById("center");
			container.appendChild(player);

			// Load your SWF file
			player.load("c.swf?path=5b.swf");
		} catch (error) {
			console.error("Error initializing Ruffle player:", error);
		}
	});
	</script>
	<p>
		This game is part of <a href="http://battlefordreamisland.com">Battle for Dream Island</a>.<br>
		<a href="http://htwins.net">HTwins.net</a>
	</p>
</div>
</body>
</html>
