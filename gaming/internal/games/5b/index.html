<html>
<head>
	<title>5b - Battle for Dream Island</title>
	<meta name="description" content="A puzzle platformer in the world of Battle for Dream Island.">
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css" type="text/css">
	<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
	<script src="ruffle.js"></script> <!-- Local ruffle.js -->
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: black;
		}

		#center {
			width: 100vw; /* Full viewport width */
			height: 100vh; /* Full viewport height */
			display: flex;
			justify-content: center;
			align-items: center;
		}

		ruffle-player {
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>
<div id="center">
	<!-- The Ruffle Player container -->
</div>
<script>
	window.RufflePlayer = window.RufflePlayer || {};
	window.RufflePlayer.config = {
		"allowScriptAccess": true,
		"autoplay": "auto",
		"publicPath": "https://gvyoutube.codeberg.page/gaming/internal/games/5b/" // Adjust to your wasm location
	};

	// Initialize Ruffle
	window.addEventListener("load", () => {
		try {
			const ruffle = window.RufflePlayer.newest(); // Get the newest Ruffle build
			const player = ruffle.createPlayer(); // Create the player
			const container = document.getElementById("center");
			container.appendChild(player); // Append the player to the container

			// Load the SWF file
			player.load("/pages/gaming/internal/games/5b/5b.swf");
		} catch (error) {
			console.error("Error initializing Ruffle:", error);
		}
	});
</script>
</body>
</html>
