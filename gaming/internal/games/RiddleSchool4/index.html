<!DOCTYPE html>
<html>
<head>
	<title>Student and Parent Sign In</title>
	<meta name="description" content="A puzzle by JonBro">
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css" type="text/css">
	<link rel="shortcut icon" type="image/x-icon" href="https://gvyoutube.codeberg.page/gaming/favicon.png">
	<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
			overflow: hidden;
		}
		#center {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100%;
			width: 100%;
			background-color: black; /* Optional background color for fullscreen */
		}
	</style>
</head>
<body>
<div id="center">
	<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
    "allowScriptAccess": true,
    "base": "https://gvyoutube.codeberg.page/gaming/internal/games/RiddleSchool4",
    "autoplay": "auto",	
};

window.addEventListener("load", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    const container = document.getElementById("center");
    container.appendChild(player);
    player.style.width = "100%";
    player.style.height = "100%"; // Ensures fullscreen
    player.load("riddleschool4.swf");
});
	</script>
</div>
</body>
</html>
