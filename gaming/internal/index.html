<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 60px 40px;
      text-align: center;
      max-width: 500px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      color: #ff6b6b;
      font-size: 3em;
      margin-bottom: 20px;
      font-weight: 700;
    }

    p {
      color: #666;
      font-size: 1.1em;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: all 0.3s;
      font-weight: 600;
    }

    a:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }

    .home-btn {
      background: #999;
    }

    .home-btn:hover {
      background: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>403</h1>
    <p>403 Forbidden.</p>
  </div>
</body>
</html>
