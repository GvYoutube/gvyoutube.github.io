  <script>
    function loginWithCodeberg() {
      const clientId = 'YOUR_CODEBERG_CLIENT_ID';
      const redirectUri = window.location.origin + '/auth/codeberg/callback';

    }

    function logout() {
      window.location = '/auth/logout';
    }

      try {
        const response = await fetch('/blog/articles');
        const articles = await response.json();

        const container = document.getElementById('articles-container');
        container.innerHTML = '';

        if (articles.length === 0) {
          container.innerHTML = '<div class="empty">No articles published yet.</div>';
          return;

            <div class="article-meta">
              <strong>${article.author}</strong> • ${article.date}
            </div>
            <div class="tags">${tagsHtml}</div>
          `;

          container.appendChild(card);
        });
      } catch (error) {
        const container = document.getElementById('articles-container');

      }
    }
