<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hmmmm...?</title>
    <style>
        /* General styling */
        body {
            margin: 0;
            padding: 0;
            background-color: #001f3f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
        }

        .shaking-text {
            position: absolute;
            animation: shake 0.5s infinite;
        }

        /* Corner text positions */
        .top-left { top: 10px; left: 10px; }
        .top-right { top: 10px; right: 10px; }
        .bottom-left { bottom: 10px; left: 10px; }
        .bottom-right { bottom: 10px; right: 10px; }

        /* Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-1px, -2px) rotate(-1deg); }
            50% { transform: translate(-3px, 0px) rotate(1deg); }
            75% { transform: translate(3px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(1deg); }
        }

        @keyframes slide-down {
            0% { top: -100px; opacity: 0; }
            100% { top: 50%; opacity: 1; }
        }

        .hidden {
            display: none;
        }

        .slide-down {
            animation: slide-down 1s ease-out forwards;
        }
    </style>
</head>
<body>
    <!-- Countdown message -->
    <div id="countdownText" class="center-text">Click 5 times for a surprise...</div>

    <!-- Bday wishes in corners -->
    <div id="topLeftText" class="shaking-text top-left hidden">Happy Birthday, Van!</div>
    <div id="topRightText" class="shaking-text top-right hidden">Wishing you a great year!</div>
    <div id="bottomLeftText" class="shaking-text bottom-left hidden">Cheers to your special day!</div>
    <div id="bottomRightText" class="shaking-text bottom-right hidden">Party Time!</div>

    <!-- Audio -->
    <audio id="bdayAudio" src="bdaymusic.wav" loop></audio>

    <script>
        // Initialize variables
        let clickCount = 0;
        const countdownText = document.getElementById("countdownText");
        const audio = document.getElementById("bdayAudio");
        const cornerTexts = [
            document.getElementById("topLeftText"),
            document.getElementById("topRightText"),
            document.getElementById("bottomLeftText"),
            document.getElementById("bottomRightText")
        ];

        // Handle click events
        document.body.addEventListener("click", () => {
            clickCount++;
            const remainingClicks = 5 - clickCount;

            if (remainingClicks > 0) {
                countdownText.textContent = `Click ${remainingClicks} more time(s) for a surprise...`;
            } else {
                // Update title and display surprise
                document.title = "Happy Birthday, Van!";
                countdownText.textContent = "Surprise!";
                countdownText.classList.add("slide-down");
                audio.play();

                // Show corner texts and trigger confetti
                cornerTexts.forEach(text => text.classList.remove("hidden"));
                startConfetti();

                // Remove click event listener
                document.body.removeEventListener("click", arguments.callee);
            }
        });

        // Confetti animation
        function startConfetti() {
            const confettiSettings = { target: 'confettiCanvas' };
            const confetti = new ConfettiGenerator(confettiSettings);
            confetti.render();
        }

        // Add confetti canvas
        const confettiCanvas = document.createElement("canvas");
        confettiCanvas.id = "confettiCanvas";
        confettiCanvas.style.position = "absolute";
        confettiCanvas.style.top = 0;
        confettiCanvas.style.left = 0;
        confettiCanvas.style.width = "100%";
        confettiCanvas.style.height = "100%";
        document.body.appendChild(confettiCanvas);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/confetti-js@0.0.18/dist/index.min.js"></script>
</body>
</html>
