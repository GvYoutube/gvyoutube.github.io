<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="xicon" href="favicon.ico" />
  <title>Gibberishdle - by GvYoutube</title>
  <style>
    :root {
      --bg: #121213;
      --text: #ffffff;
      --muted: #818384;
      --border-empty: #3a3a3c;
      --border-active: #565758;
      --correct: #538d4e;
      --present: #b59f3b;
      --absent: #3a3a3c;
      --key-bg: #818384;
      --key-hover: #939598;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      border-bottom: 1px solid var(--border-empty);
      padding: 10px 0;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.1rem;
      font-weight: 700;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.05rem;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      flex-grow: 1;
      padding-bottom: 20px;
    }

    .board-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      padding: 10px;
    }

    .board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      width: 350px;
      height: 420px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .tile {
      width: 100%;
      height: 100%;
      border: 2px solid var(--border-empty);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      background: var(--bg);
      color: var(--text);
      user-select: none;
    }

    .tile[data-state="active"] {
      border-color: var(--border-active);
      animation: pop 0.1s ease-in-out;
    }

    .tile[data-state="correct"] {
      background: var(--correct);
      border-color: var(--correct);
    }

    .tile[data-state="present"] {
      background: var(--present);
      border-color: var(--present);
    }

    .tile[data-state="absent"] {
      background: var(--absent);
      border-color: var(--absent);
    }

    /* feat: tile flipping */
    .tile.flip {
      animation: flip 0.5s ease forwards;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes flip {
      0% { transform: rotateX(0deg); }
      50% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    .keyboard {
      width: 100%;
      max-width: 500px;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      user-select: none;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .kb-key {
      font-family: inherit;
      font-weight: bold;
      border: 0;
      padding: 0;
      margin: 0;
      height: 58px;
      border-radius: 4px;
      background-color: var(--key-bg);
      color: #ffffff;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background-color 0.2s ease;
    }

    .kb-key.wide {
      flex: 1.5;
      font-size: 0.75rem;
    }

    .kb-key:hover {
      background-color: var(--key-hover);
    }

    .kb-key[data-state="correct"] { background-color: var(--correct); }
    .kb-key[data-state="present"] { background-color: var(--present); }
    .kb-key[data-state="absent"] { background-color: var(--absent); }

    .controls {
      margin-top: 15px;
    }

    .btn {
      background: var(--key-bg);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.6rem 1.2rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
    }

    .btn:hover { background: var(--key-hover); }

    .share-form {
      margin: 10px auto;
      max-width: 300px;
      display: none;
      text-align: left;
      background: #1a1a1b;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-empty);
    }

    .share-form.visible { display: block; }
    .share-form label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: #d7dadc; }
    .share-form input {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid var(--border-empty);
      border-radius: 4px;
      background: var(--bg);
      color: #ffffff;
    }

    /* win/game over popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #181819;
      border: 1px solid var(--border-empty);
      padding: 24px;
      border-radius: 8px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 4px 23px 0 rgba(0, 0, 0, 0.5);
    }

    .modal h2 { margin-top: 0; font-size: 1.5rem; }
    .modal p { color: #d7dadc; margin-bottom: 20px; line-height: 1.4; }
    .word-highlight {
      font-weight: bold;
      color: var(--correct);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <header>
    <h1>GIBBERISHDLE</h1>
    <p class="subtitle">wordle but gibberish lmao</p>
  </header>

  <div class="main-container">
    <div class="board-container">
      <div id="board" class="board"></div>
    </div>

    <div class="controls">
      <button id="shareToggleBtn" class="btn" type="button">Share Game</button>
    </div>

    <form id="shareForm" class="share-form" onsubmit="return false;">
      <label for="shareName">Your Name</label>
      <input id="shareName" type="text" placeholder="Enter your name" required />

      <label for="shareEmail">Recipient Email</label>
      <input id="shareEmail" type="email" placeholder="Enter email" required />

      <button id="sendShareBtn" class="btn" type="button" style="width: 100%;">Send</button>
    </form>

    <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
  </div>

  <!-- Win/Loss Modal -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2 id="modalTitle">You won!</h2>
      <p id="modalBody">You guessed the gibberish word!</p>
      <button id="modalCloseBtn" class="btn" type="button">Close</button>
    </div>
  </div>

  <script>
    const WORD_LENGTH = 5;
    const MAX_GUESSES = 6;
    const STORAGE_KEY = 'gibberishdle_state_v2';

    const boardEl = document.getElementById('board');
    const shareToggleBtn = document.getElementById('shareToggleBtn');
    const shareForm = document.getElementById('shareForm');
    const shareNameInput = document.getElementById('shareName');
    const shareEmailInput = document.getElementById('shareEmail');
    const sendShareBtn = document.getElementById('sendShareBtn');
    const keyboardEl = document.getElementById('keyboard');

    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    // Win audio initialization
    const winSound = new Audio('win.wav');

    let answer = '';
    let guesses = Array.from({ length: MAX_GUESSES }, () => Array(WORD_LENGTH).fill(''));
    let currentRow = 0;
    let currentCol = 0;
    let gameOver = false;
    let todayKey = getTodayKey();

    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function pseudoRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return Math.abs(h >>> 0);
    }

    function generateGibberish(dateKey) {
      const vowels = ['a', 'e', 'i', 'o', 'u', 'y'];
      const consonants = ['b', 'c', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'p', 'q', 'r', 's', 't', 'v', 'w', 'x', 'z'];
      
      let seed = hashString(`gibberishdle-${dateKey}`);
      let word = '';
      
      let isVowel = pseudoRandom(seed++) > 0.5;
      
      for (let i = 0; i < WORD_LENGTH; i++) {
        if (isVowel) {
          const idx = Math.floor(pseudoRandom(seed++) * vowels.length);
          word += vowels[idx];
        } else {
          const idx = Math.floor(pseudoRandom(seed++) * consonants.length);
          word += consonants[idx];
        }
        isVowel = !isVowel;
      }
      
      return word;
    }

    function getSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }

    function saveState() {
      const state = {
        dateKey: todayKey,
        guesses,
        currentRow,
        currentCol,
        gameOver
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadOrInitState() {
      const saved = getSavedState();
      answer = generateGibberish(todayKey);

      if (!saved || saved.dateKey !== todayKey) {
        guesses = Array.from({ length: MAX_GUESSES }, () => Array(WORD_LENGTH).fill(''));
        currentRow = 0;
        currentCol = 0;
        gameOver = false;
        saveState();
        return;
      }

      guesses = Array.isArray(saved.guesses) ? saved.guesses : guesses;
      currentRow = Number.isInteger(saved.currentRow) ? saved.currentRow : 0;
      currentCol = Number.isInteger(saved.currentCol) ? saved.currentCol : 0;
      gameOver = !!saved.gameOver;
    }

    function buildBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < MAX_GUESSES; r++) {
        const row = document.createElement('div');
        row.className = 'row';
        for (let c = 0; c < WORD_LENGTH; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }
        boardEl.appendChild(row);
      }
    }

    function buildKeyboard() {
      const rows = [
        ['Q','W','E','R','T','Y','U','I','O','P'],
        ['A','S','D','F','G','H','J','K','L'],
        ['ENTER','Z','X','C','V','B','N','M','⌫']
      ];

      keyboardEl.innerHTML = '';
      rows.forEach(rowChars => {
        const row = document.createElement('div');
        row.className = 'kb-row';
        rowChars.forEach(key => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'kb-key';
          if (key === 'ENTER' || key === '⌫') btn.classList.add('wide');
          btn.textContent = key;
          btn.dataset.key = key;
          btn.addEventListener('click', () => handleVirtualKey(key));
          row.appendChild(btn);
        });
        keyboardEl.appendChild(row);
      });
    }

    function updateBoard() {
      for (let r = 0; r < MAX_GUESSES; r++) {
        for (let c = 0; c < WORD_LENGTH; c++) {
          const tile = document.getElementById(`tile-${r}-${c}`);
          const letter = guesses[r][c];
          tile.textContent = letter;
          if (letter && !tile.dataset.state) {
            tile.dataset.state = 'active';
          } else if (!letter) {
            delete tile.dataset.state;
          }
        }
      }
    }

    function scoreGuess(guess, target) {
      const result = Array(WORD_LENGTH).fill('absent');
      const targetArr = target.split('');
      const guessArr = guess.split('');

      for (let i = 0; i < WORD_LENGTH; i++) {
        if (guessArr[i] === targetArr[i]) {
          result[i] = 'correct';
          targetArr[i] = null;
          guessArr[i] = null;
        }
      }

      for (let i = 0; i < WORD_LENGTH; i++) {
        if (!guessArr[i]) continue;
        const idx = targetArr.indexOf(guessArr[i]);
        if (idx !== -1) {
          result[i] = 'present';
          targetArr[idx] = null;
        }
      }

      return result;
    }

    function updateKeyboardKey(letter, state) {
      const keyBtn = document.querySelector(`.kb-key[data-key="${letter.toUpperCase()}"]`);
      if (!keyBtn) return;
      const currentState = keyBtn.dataset.state;
      if (currentState === 'correct') return;
      if (currentState === 'present' && state === 'absent') return;
      keyBtn.dataset.state = state;
    }

    function revealRow(rowIndex, score, animate = true) {
      for (let c = 0; c < WORD_LENGTH; c++) {
        const tile = document.getElementById(`tile-${rowIndex}-${c}`);
        const letter = guesses[rowIndex][c];

        if (animate) {
          setTimeout(() => {
            tile.classList.add('flip');
            tile.dataset.state = score[c];
            updateKeyboardKey(letter, score[c]);
          }, c * 250);
        } else {
          tile.dataset.state = score[c];
          updateKeyboardKey(letter, score[c]);
        }
      }
    }

    function restoreBoardState() {
      for (let r = 0; r < currentRow; r++) {
        const guess = guesses[r].join('').toLowerCase();
        if (guess.length === WORD_LENGTH) {
          revealRow(r, scoreGuess(guess, answer), false);
        }
      }
    }

    function showModal(isWin) {
      modalTitle.textContent = isWin ? 'Good!' : 'Game Over';
      if (isWin) {
        modalBody.innerHTML = `You solved today's gibberish word in <strong>${currentRow + 1}</strong> ${currentRow === 0 ? 'try' : 'tries'}!`;
      } else {
        modalBody.innerHTML = `The gibberish word was: <br/><br/><span class="word-highlight">${answer.toUpperCase()}</span>`;
      }
      modalOverlay.classList.add('active');
    }

    function submitGuess() {
      if (gameOver) return;
      if (currentCol < WORD_LENGTH) return;

      const guess = guesses[currentRow].join('').toLowerCase();
      const score = scoreGuess(guess, answer);
      
      revealRow(currentRow, score, true);

      const animationDelay = WORD_LENGTH * 250;

      setTimeout(() => {
        if (guess === answer) {
          gameOver = true;
          saveState();
          winSound.play().catch(e => console.warn('Audio blocked by browser policy:', e));
          showModal(true);
          return;
        }

        currentRow++;
        currentCol = 0;

        if (currentRow >= MAX_GUESSES) {
          gameOver = true;
          saveState();
          showModal(false);
          return;
        }

        saveState();
      }, animationDelay);
    }

    function isTypingInInput() {
      const active = document.activeElement;
      return active === shareNameInput || active === shareEmailInput;
    }

    function handleKeydown(e) {
      if (gameOver || isTypingInInput()) return;
      const key = e.key;

      if (/^[a-zA-Z]$/.test(key)) {
        if (currentCol < WORD_LENGTH && currentRow < MAX_GUESSES) {
          guesses[currentRow][currentCol] = key.toUpperCase();
          currentCol++;
          updateBoard();
          saveState();
        }
      } else if (key === 'Backspace') {
        if (currentCol > 0) {
          currentCol--;
          guesses[currentRow][currentCol] = '';
          updateBoard();
          saveState();
        }
      } else if (key === 'Enter') {
        submitGuess();
      }
    }

    function handleVirtualKey(key) {
      if (gameOver) return;

      if (key === 'ENTER') {
        submitGuess();
        return;
      }

      if (key === '⌫') {
        if (currentCol > 0) {
          currentCol--;
          guesses[currentRow][currentCol] = '';
          updateBoard();
          saveState();
        }
        return;
      }

      if (/^[A-Z]$/.test(key)) {
        if (currentCol < WORD_LENGTH && currentRow < MAX_GUESSES) {
          guesses[currentRow][currentCol] = key;
          currentCol++;
          updateBoard();
          saveState();
        }
      }
    }

    // Dev Command: forceWin()
    window.forceWin = function() {
      if (gameOver) {
        console.log('Game is already over for today!');
        return;
      }

      // literally just gets the answer and pastes it
      const correctChars = answer.toUpperCase().split('');
      for (let i = 0; i < WORD_LENGTH; i++) {
        guesses[currentRow][i] = correctChars[i];
      }
      currentCol = WORD_LENGTH;

      // everything, even empty is green
      updateBoard();
      revealRow(currentRow, Array(WORD_LENGTH).fill('correct'), false);

      // lock play
      gameOver = true;
      saveState();

      // play win audio
      winSound.currentTime = 0;
      winSound.play().catch(e => console.warn('Audio blocked by browser policy:', e));

      // win modal
      showModal(true);

      console.log('Force win triggered. Play locked for today.');
    };

    function toggleShareForm() {
      shareForm.classList.toggle('visible');
    }

    function sendShareInvite() {
      const name = shareNameInput.value.trim();
      const email = shareEmailInput.value.trim();

      if (!name || !email) {
        alert('Please fill out both fields.');
        return;
      }

      const subject = encodeURIComponent('Play Gibberishdle!');
      const body = encodeURIComponent(`${name} invited you to play Gibberishdle!\n\nPlay here: ${window.location.href}`);
      window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
    }

    function init() {
      todayKey = getTodayKey();
      loadOrInitState();
      buildBoard();
      buildKeyboard();
      updateBoard();
      restoreBoardState();

      if (gameOver) {
        const lastRow = Math.max(0, currentRow);
        const isWin = guesses[lastRow] && guesses[lastRow].join('').toLowerCase() === answer;
        setTimeout(() => showModal(isWin), 500);
      }

      // browser audio
      document.addEventListener('click', () => {
        winSound.load();
      }, { once: true });

      document.addEventListener('keydown', handleKeydown);
      shareToggleBtn.addEventListener('click', toggleShareForm);
      sendShareBtn.addEventListener('click', sendShareInvite);
      modalCloseBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
    }

    init();
  </script>
</body>
</html>
