<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gibberishdle</title>
  <style>
    :root {
      --bg: #121213;
      --text: #ffffff;
      --muted: #b5b5b5;
      --tile-border: #3a3a3c;
      --tile-filled-border: #565758;
      --btn: #818384;
      --btn-hover: #939598;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin-bottom: 0.25rem;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 1.5rem;
      color: var(--muted);
      font-size: 1rem;
    }

    .board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      width: min(96vw, 430px);
      margin: 0 auto 1.5rem;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .tile {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--tile-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: bold;
      text-transform: uppercase;
      background: var(--bg);
      line-height: 1;
    }

    .tile.filled {
      border-color: var(--tile-filled-border);
    }

    .tile.correct {
      background: #538d4e;
      border-color: #538d4e;
      color: white;
    }

    .tile.present {
      background: #b59f3b;
      border-color: #b59f3b;
      color: white;
    }

    .tile.absent {
      background: #3a3a3c;
      border-color: #3a3a3c;
      color: white;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    button {
      background: var(--btn);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.6rem 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--btn-hover);
    }

    .share-form {
      margin: 1rem auto 0;
      max-width: 340px;
      display: none;
      text-align: left;
    }

    .share-form.visible {
      display: block;
    }

    .share-form label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
      color: #d7dadc;
    }

    .share-form input {
      width: 100%;
      margin-bottom: 0.75rem;
      padding: 0.55rem 0.6rem;
      border: 1px solid #3a3a3c;
      border-radius: 4px;
      background: #1a1a1b;
      color: #ffffff;
    }

    .status {
      min-height: 1.25rem;
      margin-top: 1rem;
      color: #d7dadc;
    }
  </style>
</head>
<body>
  <h1>Gibberishdle</h1>
  <p class="subtitle">wordle but gibberish lmao</p>

  <div id="board" class="board"></div>

  <div class="controls">
    <button id="shareToggleBtn" type="button">Share</button>
  </div>

  <form id="shareForm" class="share-form" onsubmit="return false;">
    <label for="shareName">Your name</label>
    <input id="shareName" type="text" placeholder="Enter your name" required />

    <label for="shareEmail">Recipient email</label>
    <input id="shareEmail" type="email" placeholder="Enter email" required />

    <button id="sendShareBtn" type="button">Send</button>
  </form>

  <p id="status" class="status"></p>

  <script>
    const WORD_LENGTH = 5;
    const MAX_GUESSES = 6;
    const answer = 'blorf';

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const shareToggleBtn = document.getElementById('shareToggleBtn');
    const shareForm = document.getElementById('shareForm');
    const shareNameInput = document.getElementById('shareName');
    const shareEmailInput = document.getElementById('shareEmail');
    const sendShareBtn = document.getElementById('sendShareBtn');

    let guesses = Array.from({ length: MAX_GUESSES }, () => Array(WORD_LENGTH).fill(''));
    let currentRow = 0;
    let currentCol = 0;
    let gameOver = false;

    function buildBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < MAX_GUESSES; r++) {
        const row = document.createElement('div');
        row.className = 'row';

        for (let c = 0; c < WORD_LENGTH; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }

        boardEl.appendChild(row);
      }
    }

    function updateBoard() {
      for (let r = 0; r < MAX_GUESSES; r++) {
        for (let c = 0; c < WORD_LENGTH; c++) {
          const tile = document.getElementById(`tile-${r}-${c}`);
          const letter = guesses[r][c];
          tile.textContent = letter;
          tile.classList.remove('filled');
          tile.classList.remove('correct', 'present', 'absent');
          if (letter) tile.classList.add('filled');
        }
      }
    }

    function scoreGuess(guess, target) {
      const result = Array(WORD_LENGTH).fill('absent');
      const targetArr = target.split('');
      const guessArr = guess.split('');

      for (let i = 0; i < WORD_LENGTH; i++) {
        if (guessArr[i] === targetArr[i]) {
          result[i] = 'correct';
          targetArr[i] = null;
          guessArr[i] = null;
        }
      }

      for (let i = 0; i < WORD_LENGTH; i++) {
        if (!guessArr[i]) continue;
        const idx = targetArr.indexOf(guessArr[i]);
        if (idx !== -1) {
          result[i] = 'present';
          targetArr[idx] = null;
        }
      }

      return result;
    }

    function revealRow(rowIndex, score) {
      for (let c = 0; c < WORD_LENGTH; c++) {
        const tile = document.getElementById(`tile-${rowIndex}-${c}`);
        tile.classList.add(score[c]);
      }
    }

    function submitGuess() {
      if (currentCol < WORD_LENGTH || gameOver) return;

      const guess = guesses[currentRow].join('').toLowerCase();
      const score = scoreGuess(guess, answer);
      revealRow(currentRow, score);

      if (guess === answer) {
        statusEl.textContent = 'You got it!';
        gameOver = true;
        return;
      }

      currentRow++;
      currentCol = 0;

      if (currentRow >= MAX_GUESSES) {
        statusEl.textContent = `Game over! The word was ${answer.toUpperCase()}.`;
        gameOver = true;
      }
    }

    function handleKeydown(e) {
      if (gameOver) return;

      const key = e.key;

      if (/^[a-zA-Z]$/.test(key)) {
        if (currentCol < WORD_LENGTH && currentRow < MAX_GUESSES) {
          guesses[currentRow][currentCol] = key.toUpperCase();
          currentCol++;
          updateBoard();
        }
      } else if (key === 'Backspace') {
        if (currentCol > 0) {
          currentCol--;
          guesses[currentRow][currentCol] = '';
          updateBoard();
        }
      } else if (key === 'Enter') {
        submitGuess();
      }
    }

    function toggleShareForm() {
      shareForm.classList.toggle('visible');
      statusEl.textContent = '';
    }

    function sendShareInvite() {
      const name = shareNameInput.value.trim();
      const email = shareEmailInput.value.trim();

      if (!name || !email) {
        statusEl.textContent = 'Please enter both a name and an email.';
        return;
      }

      const subject = encodeURIComponent('Play Gibberishdle!');
      const body = encodeURIComponent(`${name} invited you to play Gibberishdle!\nPlay it at https://gvyoutube.com/gibberishdle/!`);
      const mailtoLink = `mailto:${email}?subject=${subject}&body=${body}`;

      window.location.href = mailtoLink;
    }

    document.addEventListener('keydown', handleKeydown);
    shareToggleBtn.addEventListener('click', toggleShareForm);
    sendShareBtn.addEventListener('click', sendShareInvite);

    buildBoard();
    updateBoard();
  </script>
</body>
</html>
