<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gibberishdle</title>
  <style>
    :root {
      --bg: #121213;
      --text: #ffffff;
      --muted: #b5b5b5;
      --tile-border: #3a3a3c;
      --tile-filled-border: #565758;
      --btn: #818384;
      --btn-hover: #939598;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin-bottom: 0.25rem;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 1.5rem;
      color: var(--muted);
      font-size: 1rem;
    }

    .board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      width: min(96vw, 430px);
      margin: 0 auto 1.5rem;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .tile {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--tile-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: bold;
      text-transform: uppercase;
      background: var(--bg);
      line-height: 1;
    }

    .tile.filled {
      border-color: var(--tile-filled-border);
    }

    .tile.correct {
      background: #538d4e;
      border-color: #538d4e;
      color: white;
    }

    .tile.present {
      background: #b59f3b;
      border-color: #b59f3b;
      color: white;
    }

    .tile.absent {
      background: #3a3a3c;
      border-color: #3a3a3c;
      color: white;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    button {
      background: var(--btn);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.6rem 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--btn-hover);
    }

    .share-form {
      margin: 1rem auto 0;
      max-width: 340px;
      display: none;
      text-align: left;
    }

    .share-form.visible {
      display: block;
    }

    .share-form label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
      color: #d7dadc;
    }

    .share-form input {
      width: 100%;
      margin-bottom: 0.75rem;
      padding: 0.55rem 0.6rem;
      border: 1px solid #3a3a3c;
      border-radius: 4px;
      background: #1a1a1b;
      color: #ffffff;
    }

    /* NEW: on-screen keyboard */
    .keyboard {
      width: min(96vw, 500px);
      margin: 0 auto;
      display: grid;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .kb-key {
      min-width: 34px;
      height: 52px;
      padding: 0 0.45rem;
      border-radius: 4px;
      border: none;
      background: #818384;
      color: #fff;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
    }

    .kb-key:hover {
      background: #939598;
    }

    .kb-key.wide {
      min-width: 64px;
      font-size: 0.85rem;
    }

    .status {
      min-height: 1.25rem;
      margin-top: 1rem;
      color: #d7dadc;
    }
  </style>
</head>
<body>
  <h1>Gibberishdle</h1>
  <p class="subtitle">wordle but gibberish lmao</p>

  <div id="board" class="board"></div>

  <div class="controls">
    <button id="shareToggleBtn" type="button">Share</button>
  </div>

  <form id="shareForm" class="share-form" onsubmit="return false;">
    <label for="shareName">Your name</label>
    <input id="shareName" type="text" placeholder="Enter your name" required />

    <label for="shareEmail">Recipient email</label>
    <input id="shareEmail" type="email" placeholder="Enter email" required />

    <button id="sendShareBtn" type="button">Send</button>
  </form>

  <!-- NEW: mobile-friendly keyboard -->
  <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>

  <p id="status" class="status"></p>

  <script>
  const WORD_LENGTH = 5;
  const MAX_GUESSES = 6;
  const STORAGE_KEY = 'gibberishdle_state_v1';

  // Small gibberish dictionary (must all be 5 letters)
  const WORD_LIST = [
    'blorf', 'snarp', 'glint', 'droob', 'flarn',
    'crint', 'plonk', 'zibby', 'trusk', 'mivor',
    'quarn', 'vlept', 'jorpy', 'knurl', 'brynt',
    'thwip', 'grone', 'slorp', 'frizz', 'clunk'
  ];

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const shareToggleBtn = document.getElementById('shareToggleBtn');
  const shareForm = document.getElementById('shareForm');
  const shareNameInput = document.getElementById('shareName');
  const shareEmailInput = document.getElementById('shareEmail');
  const sendShareBtn = document.getElementById('sendShareBtn');
  const keyboardEl = document.getElementById('keyboard');

  // NEW: win sound
  const winAudio = new Audio('win.wav');

  let answer = '';
  let guesses = Array.from({ length: MAX_GUESSES }, () => Array(WORD_LENGTH).fill(''));
  let currentRow = 0;
  let currentCol = 0;
  let gameOver = false;
  let lockedForToday = false;
  let todayKey = getTodayKey();

  function getTodayKey() {
    // Local date key YYYY-MM-DD
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function hashString(str) {
    // Simple deterministic hash
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
    }
    return Math.abs(h >>> 0);
  }

  function getDailyAnswer(dateKey) {
    const seed = hashString(`gibberishdle-${dateKey}`);
    return WORD_LIST[seed % WORD_LIST.length];
  }

  function emptyGuesses() {
    return Array.from({ length: MAX_GUESSES }, () => Array(WORD_LENGTH).fill(''));
  }

  function getSavedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function saveState() {
    const state = {
      dateKey: todayKey,
      guesses,
      currentRow,
      currentCol,
      gameOver,
      lockedForToday
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadOrInitState() {
    const saved = getSavedState();
    answer = getDailyAnswer(todayKey);

    if (!saved || saved.dateKey !== todayKey) {
      // New day: reset
      guesses = emptyGuesses();
      currentRow = 0;
      currentCol = 0;
      gameOver = false;
      lockedForToday = false;
      saveState();
      return;
    }

    // Restore same-day state
    guesses = Array.isArray(saved.guesses) ? saved.guesses : emptyGuesses();
    currentRow = Number.isInteger(saved.currentRow) ? saved.currentRow : 0;
    currentCol = Number.isInteger(saved.currentCol) ? saved.currentCol : 0;
    gameOver = !!saved.gameOver;
    lockedForToday = !!saved.lockedForToday;

    // Safety clamps
    currentRow = Math.max(0, Math.min(MAX_GUESSES, currentRow));
    currentCol = Math.max(0, Math.min(WORD_LENGTH, currentCol));
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    for (let r = 0; r < MAX_GUESSES; r++) {
      const row = document.createElement('div');
      row.className = 'row';

      for (let c = 0; c < WORD_LENGTH; c++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${r}-${c}`;
        row.appendChild(tile);
      }

      boardEl.appendChild(row);
    }
  }

  // NEW
  function buildKeyboard() {
    const rows = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L'],
      ['ENTER','Z','X','C','V','B','N','M','⌫']
    ];

    keyboardEl.innerHTML = '';

    rows.forEach(rowChars => {
      const row = document.createElement('div');
      row.className = 'kb-row';

      rowChars.forEach(key => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'kb-key';
        if (key === 'ENTER' || key === '⌫') btn.classList.add('wide');
        btn.textContent = key;
        btn.dataset.key = key;
        btn.addEventListener('click', () => handleVirtualKey(key));
        row.appendChild(btn);
      });

      keyboardEl.appendChild(row);
    });
  }

  function updateBoard() {
    for (let r = 0; r < MAX_GUESSES; r++) {
      for (let c = 0; c < WORD_LENGTH; c++) {
        const tile = document.getElementById(`tile-${r}-${c}`);
        const letter = guesses[r][c];
        tile.textContent = letter;
        tile.classList.remove('filled', 'correct', 'present', 'absent');
        if (letter) tile.classList.add('filled');
      }
    }
  }

  function scoreGuess(guess, target) {
    const result = Array(WORD_LENGTH).fill('absent');
    const targetArr = target.split('');
    const guessArr = guess.split('');

    for (let i = 0; i < WORD_LENGTH; i++) {
      if (guessArr[i] === targetArr[i]) {
        result[i] = 'correct';
        targetArr[i] = null;
        guessArr[i] = null;
      }
    }

    for (let i = 0; i < WORD_LENGTH; i++) {
      if (!guessArr[i]) continue;
      const idx = targetArr.indexOf(guessArr[i]);
      if (idx !== -1) {
        result[i] = 'present';
        targetArr[idx] = null;
      }
    }

    return result;
  }

  function revealRow(rowIndex, score) {
    for (let c = 0; c < WORD_LENGTH; c++) {
      const tile = document.getElementById(`tile-${rowIndex}-${c}`);
      tile.classList.add(score[c]);
    }
  }

  function revealPlayedRowsFromState() {
    for (let r = 0; r < MAX_GUESSES; r++) {
      const guess = guesses[r].join('').toLowerCase();
      if (guess.length === WORD_LENGTH && /^[a-z]{5}$/.test(guess)) {
        revealRow(r, scoreGuess(guess, answer));
      }
    }
  }

  function endGame(message) {
    statusEl.textContent = message;
    gameOver = true;
    lockedForToday = true; // Prevent replay today
    saveState();
  }

  function submitGuess() {
    if (gameOver || lockedForToday) return;
    if (currentCol < WORD_LENGTH) return;

    const guess = guesses[currentRow].join('').toLowerCase();
    const score = scoreGuess(guess, answer);
    revealRow(currentRow, score);

    if (guess === answer) {
      // NEW: play win sound
      winAudio.currentTime = 0;
      winAudio.play().catch(() => {});
      endGame('You got it! Come back tomorrow for a new gibberish word.');
      return;
    }

    currentRow++;
    currentCol = 0;

    if (currentRow >= MAX_GUESSES) {
      endGame(`Game over! The word was ${answer.toUpperCase()}. Come back tomorrow.`);
      return;
    }

    saveState();
  }

  // NEW: ignore game key input while typing in share fields
  function isTypingInShareInput() {
    const active = document.activeElement;
    return active === shareNameInput || active === shareEmailInput;
  }

  function handleKeydown(e) {
    if (gameOver || lockedForToday) return;
    if (isTypingInShareInput()) return;

    const key = e.key;

    if (/^[a-zA-Z]$/.test(key)) {
      if (currentCol < WORD_LENGTH && currentRow < MAX_GUESSES) {
        guesses[currentRow][currentCol] = key.toUpperCase();
        currentCol++;
        updateBoard();
        saveState();
      }
    } else if (key === 'Backspace') {
      if (currentCol > 0) {
        currentCol--;
        guesses[currentRow][currentCol] = '';
        updateBoard();
        saveState();
      }
    } else if (key === 'Enter') {
      submitGuess();
    }
  }

  // NEW: input handler for on-screen keyboard
  function handleVirtualKey(key) {
    if (gameOver || lockedForToday) return;

    if (key === 'ENTER') {
      submitGuess();
      return;
    }

    if (key === '⌫') {
      if (currentCol > 0) {
        currentCol--;
        guesses[currentRow][currentCol] = '';
        updateBoard();
        saveState();
      }
      return;
    }

    if (/^[A-Z]$/.test(key)) {
      if (currentCol < WORD_LENGTH && currentRow < MAX_GUESSES) {
        guesses[currentRow][currentCol] = key;
        currentCol++;
        updateBoard();
        saveState();
      }
    }
  }

  function toggleShareForm() {
    shareForm.classList.toggle('visible');
    if (!gameOver) statusEl.textContent = '';
  }

  function sendShareInvite() {
    const name = shareNameInput.value.trim();
    const email = shareEmailInput.value.trim();

    if (!name || !email) {
      statusEl.textContent = 'Please enter both a name and an email.';
      return;
    }

    const subject = encodeURIComponent('Play Gibberishdle!');
    const body = encodeURIComponent(
      `${name} invited you to play Gibberishdle!\nPlay it at https://gvyoutube.com/gibberishdle/*  *Gibberishdle is not endorsed by your email provider, or anyone in your orginization, if you're in one. If you keep\nreciving these messages, talk to\nthe person who's sending them.`
    );
    const mailtoLink = `mailto:${email}?subject=${subject}&body=${body}`;
    window.location.href = mailtoLink;
  }

  function init() {
    todayKey = getTodayKey();
    loadOrInitState();
    buildBoard();
    buildKeyboard(); // NEW
    updateBoard();
    revealPlayedRowsFromState();

    if (lockedForToday || gameOver) {
      statusEl.textContent = 'You already played today. Come back tomorrow for a new wo- er, gibberish word.';
      gameOver = true;
      lockedForToday = true;
    }

    document.addEventListener('keydown', handleKeydown);
    shareToggleBtn.addEventListener('click', toggleShareForm);
    sendShareBtn.addEventListener('click', sendShareInvite);
  }

  init();
</script>
 
</body>
</html>
